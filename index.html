<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Budget Tracker | Multi-Currency Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    :root {
      --bg: #030712;
      --card: rgba(17, 24, 39, 0.8);
      --accent: #6366f1;
      --success: #10b981;
      --danger: #f43f5e;
      --text-main: #f9fafb;
      --text-dim: #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container { width: 100%; max-width: 440px; opacity: 0; }

    .header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
    .header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    .header-info { text-align: right; }
    .live-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 10px var(--success); }
    .date-time { font-size: 0.7rem; font-weight: 600; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    .main-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .label { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .amount-big { font-size: 2.8rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -1px; }
    .sub-values { color: var(--text-dim); font-size: 0.95rem; font-weight: 600; margin-bottom: 20px; }
    .currency-tag { font-size: 0.7rem; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-right: 4px; color: #fff; }

    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
    .mini-card { background: rgba(255, 255, 255, 0.03); padding: 16px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .mini-card .val { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .mini-card .multi { font-size: 0.7rem; color: var(--text-dim); margin-top: 4px; display: block; }

    input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 18px 20px;
      border-radius: 20px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s;
    }
    input:focus { outline: none; border-color: var(--accent); background: rgba(0,0,0,0.5); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1rem;
      margin-top: 12px;
      cursor: pointer;
      box-shadow: 0 10px 20px -10px var(--accent);
      transition: all 0.3s;
    }
    .btn-primary:active { transform: scale(0.98); }

    .rate-ticker {
      background: rgba(99, 102, 241, 0.1);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-block;
      margin-top: 15px;
    }

    .chart-container { height: 280px; margin-top: 10px; position: relative; }
    
    .status-pill {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      margin-bottom: 16px;
    }
    .safe { background: rgba(16, 185, 129, 0.1); color: var(--success); }
    .warn { background: rgba(244, 63, 94, 0.1); color: var(--danger); }

    .footer {
      text-align: center;
      margin-top: 10px;
      padding-bottom: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="app-container" id="app">
  <div class="header">
    <h1>Budget Tracker</h1>
    <div class="header-info">
      <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-dim);">
        <span class="live-dot"></span>LIVE SESSION
      </div>
      <div id="real-time" class="date-time">Loading...</div>
    </div>
  </div>

  <!-- Primary Balance Card -->
  <div class="main-card">
    <div id="status-pill" class="status-pill safe">SYSTEM READY</div>
    <div class="label">Pocket Remaining</div>
    <div class="amount-big" id="pocket-usd">$0.00</div>
    <div class="sub-values" id="pocket-multi">--- MVR | --- LKR</div>
    
    <div id="rate-ticker" class="rate-ticker">SYNCING MARKET DATA...</div>

    <div class="stat-row">
      <div class="mini-card">
        <div class="label">Total Spent</div>
        <div class="val" id="spent-total-usd" style="color: var(--danger);">$0.00</div>
        <span class="multi" id="spent-total-multi">0 MVR | 0 LKR</span>
      </div>
      <div class="mini-card">
        <div class="label">Est. Savings</div>
        <div class="val" id="savings-total" style="color: var(--success);">$400.00</div>
        <span class="multi" id="savings-multi">0 MVR | 0 LKR</span>
      </div>
    </div>
  </div>

  <!-- Entry Card -->
  <div class="main-card" style="padding: 24px;">
    <div class="label">Quick Expense Log</div>
    <input type="number" id="mvr-input" placeholder="Value in MVR" inputmode="decimal">
    <button class="btn-primary" onclick="addExpense()">Confirm Transaction</button>
    <button onclick="resetData()" style="width:100%; background:none; border:none; color:var(--text-dim); font-size:0.7rem; margin-top:15px; cursor:pointer; font-weight:700; letter-spacing:1px;">RESET MONTHLY DATA</button>
  </div>

  <!-- Chart Card -->
  <div class="main-card">
    <div class="label" style="text-align: center; margin-bottom: 20px;">Monthly Allocation Breakdown</div>
    <div class="chart-container">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <div class="footer">
    This is developed by Shahinth - 2026
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // UPDATED: Time & Date Logic
  function updateTime() {
    const now = new Date();
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    const dateStr = now.toLocaleDateString('en-US', options);
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    document.getElementById('real-time').innerText = `${dateStr} | ${timeStr}`;
  }
  setInterval(updateTime, 1000);
  updateTime();

  window.onload = () => {
    gsap.to("#app", { opacity: 1, y: -20, duration: 1, ease: "power4.out" });
  };

  const firebaseConfig = {
    apiKey: "AIzaSyDQ8iPyHCMzK3zyrYEBzDvidRJxpQ4EZaY",
    authDomain: "mybudget-d79e6.firebaseapp.com",
    databaseURL: "https://mybudget-d79e6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mybudget-d79e6",
    storageBucket: "mybudget-d79e6.firebasestorage.app",
    messagingSenderId: "258880197131",
    appId: "1:258880197131:web:f228ad55f3f7c0c9972d0e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const spentRef = db.ref('spentMvr');

  let RATE_MVR = 15.42; 
  let RATE_LKR = 298.50; 
  const LIMIT_USD = 150;
  const BASE_SAVINGS = 400;
  const COUNTRY_SEND = 350;

  let currentSpentMvr = 0;
  let myChartObj;

  async function fetchRates() {
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      const data = await res.json();
      if (data && data.rates) {
        RATE_MVR = data.rates.MVR;
        RATE_LKR = data.rates.LKR;
        document.getElementById('rate-ticker').innerText = `1 USD = ${RATE_MVR.toFixed(2)} MVR | ${RATE_LKR.toFixed(2)} LKR`;
        refreshUI();
      }
    } catch (err) { console.warn("Rate fetch failed"); }
  }

  spentRef.on('value', (snap) => {
    currentSpentMvr = snap.val() || 0;
    refreshUI();
  });

  function refreshUI() {
    const spentUsd = currentSpentMvr / RATE_MVR;
    const remainingUsd = Math.max(0, LIMIT_USD - spentUsd);
    const overUsd = Math.max(0, spentUsd - LIMIT_USD);
    const finalSavingsUsd = BASE_SAVINGS - overUsd;

    document.getElementById('pocket-usd').innerText = `$${remainingUsd.toFixed(2)}`;
    document.getElementById('pocket-multi').innerText = `${(remainingUsd * RATE_MVR).toFixed(0)} MVR | ${(remainingUsd * RATE_LKR).toFixed(0)} LKR`;
    
    document.getElementById('spent-total-usd').innerText = `$${spentUsd.toFixed(2)}`;
    document.getElementById('spent-total-multi').innerText = `${currentSpentMvr.toFixed(0)} MVR | ${(spentUsd * RATE_LKR).toFixed(0)} LKR`;

    document.getElementById('savings-total').innerText = `$${Math.max(0, finalSavingsUsd).toFixed(2)}`;
    document.getElementById('savings-multi').innerText = `${(Math.max(0, finalSavingsUsd) * RATE_MVR).toFixed(0)} MVR | ${(Math.max(0, finalSavingsUsd) * RATE_LKR).toFixed(0)} LKR`;

    const pill = document.getElementById('status-pill');
    if(overUsd > 0) {
      pill.innerText = "BUDGET OVER LIMIT";
      pill.className = "status-pill warn";
    } else {
      pill.innerText = "BUDGET ON TRACK";
      pill.className = "status-pill safe";
    }

    renderChart(spentUsd, remainingUsd, finalSavingsUsd);
  }

  function addExpense() {
    const input = document.getElementById('mvr-input');
    const val = parseFloat(input.value);
    if (val > 0) {
      gsap.to(".btn-primary", { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
      spentRef.set(currentSpentMvr + val);
      input.value = '';
    }
  }

  function resetData() {
    if(confirm("Confirm: This will clear all expenses for the current month.")) spentRef.set(0);
  }

  function renderChart(spent, left, savings) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChartObj) myChartObj.destroy();

    const dataValues = [COUNTRY_SEND, Math.max(0, savings), spent];
    const labels = ['Fixed Transfer', 'Projected Savings', 'Current Spending'];

    myChartObj = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataValues,
          backgroundColor: ['#6366f1', '#10b981', '#f43f5e'],
          borderWidth: 0,
          hoverOffset: 25
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'bottom', 
            labels: { color: '#9ca3af', font: { family: 'Plus Jakarta Sans', weight: '600', size: 11 }, padding: 20 } 
          },
          tooltip: {
            backgroundColor: 'rgba(3, 7, 18, 0.95)',
            titleFont: { size: 14, weight: '800' },
            bodyFont: { size: 12 },
            padding: 15,
            cornerRadius: 15,
            displayColors: true,
            callbacks: {
              label: function(context) {
                const usd = context.parsed;
                const mvr = (usd * RATE_MVR).toLocaleString(undefined, {maximumFractionDigits: 0});
                const lkr = (usd * RATE_LKR).toLocaleString(undefined, {maximumFractionDigits: 0});
                return [
                  ` USD: $${usd.toFixed(2)}`,
                  ` MVR: ${mvr}`,
                  ` LKR: ${lkr}`
                ];
              }
            }
          }
        },
        cutout: '75%'
      }
    });
  }

  fetchRates();
</script>
</body>
</html>
