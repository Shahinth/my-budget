<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Budget Tracker | Multi-Currency</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .value { font-size: 2rem; font-weight: 800; margin-bottom: 15px; }
    .currency-sub { font-size: 0.9rem; color: #64748b; margin-top: -12px; margin-bottom: 8px; font-weight: 500; }
    .live-rates-ticker { font-size: 0.75rem; color: var(--primary); margin-bottom: 15px; font-weight: 600; opacity: 0.9; }

    .progress-container {
      background: #334155;
      height: 10px;
      border-radius: 10px;
      margin: 10px 0 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      width: 100%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
      box-sizing: border-box;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      background: var(--primary);
      color: white;
      transition: 0.2s;
    }
    button:active { transform: scale(0.97); }
    
    .reset-btn { background: transparent; color: #64748b; font-size: 0.75rem; text-decoration: underline; margin-top: 12px; border: none; width: 100%; cursor: pointer; }

    .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .small-card { background: rgba(15, 23, 42, 0.4); padding: 15px; border-radius: 18px; }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .badge-safe { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-over { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

    canvas { max-height: 350px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Main Balance Display -->
  <div class="glass-card">
    <div id="status-badge" class="status-badge badge-safe">ON TRACK</div>
    <div class="label">Pocket Money Remaining</div>
    <div id="pocket-usd" class="value">$0.00</div>
    <div id="pocket-multi" class="currency-sub">Syncing rates...</div>
    <div id="live-ticker" class="live-rates-ticker">1 USD = -- MVR | -- LKR</div>
    
    <div class="progress-container">
      <div id="pocket-bar" class="progress-bar"></div>
    </div>

    <div class="grid-stats">
      <div class="small-card">
        <div class="label">Projected Savings</div>
        <div id="savings-usd" style="font-weight:bold; color:var(--success); font-size: 1.1rem;">$400.00</div>
      </div>
      <div class="small-card">
        <div class="label">Fixed Country Send</div>
        <div style="font-weight:bold; font-size: 1.1rem;">$350.00</div>
      </div>
    </div>
  </div>

  <!-- Entry Section -->
  <div class="glass-card">
    <div class="label" style="margin-bottom:12px">Log Expense (MVR)</div>
    <input type="number" id="mvr-input" placeholder="Enter amount in MVR" inputmode="decimal">
    <button onclick="addExpense()">Add to Tracker</button>
    <button class="reset-btn" onclick="resetData()">Reset Data for New Month</button>
  </div>

  <!-- Distribution Chart -->
  <div class="glass-card">
    <div class="label" style="margin-bottom:15px; text-align:center;">Budget Breakdown</div>
    <div style="height: 300px;">
        <canvas id="myChart"></canvas>
    </div>
  </div>
</div>

<!-- FIREBASE SDKS (Compat) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // 1. PROJECT CONFIGURATION
  const firebaseConfig = {
    apiKey: "AIzaSyDQ8iPyHCMzK3zyrYEBzDvidRJxpQ4EZaY",
    authDomain: "mybudget-d79e6.firebaseapp.com",
    databaseURL: "https://mybudget-d79e6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mybudget-d79e6",
    storageBucket: "mybudget-d79e6.firebasestorage.app",
    messagingSenderId: "258880197131",
    appId: "1:258880197131:web:f228ad55f3f7c0c9972d0e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const spentRef = db.ref('spentMvr');

  // 2. STATE VARIABLES
  let RATE_MVR = 15.42; 
  let RATE_LKR = 298.50; 
  const LIMIT_USD = 150;
  const BASE_SAVINGS = 400;
  const COUNTRY_SEND = 350;

  let currentSpentMvr = 0;
  let myChartObj;

  // 3. FETCH LIVE CURRENCY
  async function fetchRates() {
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      const data = await res.json();
      if (data && data.rates) {
        RATE_MVR = data.rates.MVR;
        RATE_LKR = data.rates.LKR;
        // Update the Live Rate Ticker
        document.getElementById('live-ticker').innerText = `1 USD = ${RATE_MVR.toFixed(2)} MVR | ${RATE_LKR.toFixed(2)} LKR`;
        refreshUI();
      }
    } catch (err) {
      console.warn("Rates failed, using internal defaults.");
    }
  }

  // 4. DATA LISTENERS
  spentRef.on('value', (snap) => {
    currentSpentMvr = snap.val() || 0;
    refreshUI();
  });

  function refreshUI() {
    const spentUsd = currentSpentMvr / RATE_MVR;
    const remainingUsd = Math.max(0, LIMIT_USD - spentUsd);
    const overageUsd = Math.max(0, spentUsd - LIMIT_USD);
    const finalSavings = BASE_SAVINGS - overageUsd;

    const remMvr = remainingUsd * RATE_MVR;
    const remLkr = remainingUsd * RATE_LKR;

    document.getElementById('pocket-usd').innerText = `$${remainingUsd.toFixed(2)}`;
    document.getElementById('pocket-multi').innerHTML = 
      `${remMvr.toFixed(0)} MVR <span style="margin:0 8px; opacity:0.3">|</span> ${remLkr.toFixed(0)} LKR`;
    
    const savingsEl = document.getElementById('savings-usd');
    savingsEl.innerText = `$${finalSavings.toFixed(2)}`;

    const pct = (remainingUsd / LIMIT_USD) * 100;
    const bar = document.getElementById('pocket-bar');
    bar.style.width = pct + '%';
    
    const badge = document.getElementById('status-badge');
    if (overageUsd > 0) {
      badge.innerText = "OVERSPENT";
      badge.className = "status-badge badge-over";
      savingsEl.style.color = "var(--danger)";
      bar.style.background = "var(--danger)";
    } else {
      badge.innerText = "ON TRACK";
      badge.className = "status-badge badge-safe";
      savingsEl.style.color = "var(--success)";
      bar.style.background = "linear-gradient(90deg, var(--primary), var(--success))";
    }

    renderChart(spentUsd, remainingUsd, finalSavings);
  }

  function addExpense() {
    const input = document.getElementById('mvr-input');
    const val = parseFloat(input.value);
    if (val > 0) {
      spentRef.set(currentSpentMvr + val);
      input.value = '';
    }
  }

  function resetData() {
    if(confirm("Clear all data for the new month?")) {
      spentRef.set(0);
    }
  }

  function renderChart(spent, left, savings) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChartObj) myChartObj.destroy();

    const labelSpent = `Spent: $${spent.toFixed(1)} | ${(spent * RATE_MVR).toFixed(0)} MVR | ${(spent * RATE_LKR).toFixed(0)} LKR`;
    const labelSave = `Savings: $${savings.toFixed(1)} | ${(savings * RATE_MVR).toFixed(0)} MVR | ${(savings * RATE_LKR).toFixed(0)} LKR`;
    const labelCountry = `Country: $${COUNTRY_SEND} | ${(COUNTRY_SEND * RATE_MVR).toFixed(0)} MVR | ${(COUNTRY_SEND * RATE_LKR).toFixed(0)} LKR`;

    myChartObj = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: [labelCountry, labelSave, labelSpent],
        datasets: [{
          data: [COUNTRY_SEND, Math.max(0, savings), spent],
          backgroundColor: ['#3b82f6', '#22c55e', '#ef4444'],
          borderWidth: 0,
          hoverOffset: 15
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'bottom', 
            labels: { color: '#94a3b8', font: { size: 10, family: 'Inter' }, padding: 15 } 
          },
          tooltip: {
            callbacks: {
              label: (item) => {
                const v = item.raw;
                return [
                  ` USD: $${v.toFixed(2)}`,
                  ` MVR: ${(v * RATE_MVR).toFixed(0)}`,
                  ` LKR: ${(v * RATE_LKR).toFixed(0)}`
                ];
              }
            }
          }
        },
        cutout: '70%'
      }
    });
  }

  fetchRates();
</script>

</body>
</html>
