<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Budget Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #1e293b, #0f172a);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h2 { font-weight: 700; letter-spacing: -0.5px; margin-top: 0; }
    
    .label { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .value { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; }
    .mvr-sub { font-size: 0.9rem; color: #64748b; margin-top: -12px; margin-bottom: 15px; }

    /* Progress Bar */
    .progress-container {
      background: #334155;
      height: 8px;
      border-radius: 10px;
      margin: 10px 0 20px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--success));
      width: 100%;
      transition: width 0.5s ease, background 0.5s ease;
    }

    /* Input Styling */
    .input-group { position: relative; margin-bottom: 15px; }
    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      transition: 0.3s;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      background: var(--primary);
      color: white;
    }
    button:active { transform: scale(0.98); }
    button.add-btn { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    
    .reset-btn { background: transparent; color: #64748b; font-size: 0.8rem; text-decoration: underline; margin-top: 10px; width: 100%; border: none; cursor: pointer;}

    .grid-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .small-card { background: rgba(15, 23, 42, 0.4); padding: 15px; border-radius: 18px; text-align: left; }
    
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .badge-safe { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-over { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <div class="glass-card">
    <div id="status-badge" class="status-badge badge-safe">ON TRACK</div>
    <div class="label">Remaining Pocket Money</div>
    <div id="pocket-usd" class="value">$0.00</div>
    <div id="pocket-mvr" class="mvr-sub">0.00 MVR</div>
    
    <div class="progress-container">
      <div id="pocket-bar" class="progress-bar"></div>
    </div>

    <div class="grid-stats">
      <div class="small-card">
        <div class="label">Final Savings</div>
        <div id="savings-usd" style="font-weight:bold; color:var(--success)">$400.00</div>
      </div>
      <div class="small-card">
        <div class="label">Fixed Country</div>
        <div style="font-weight:bold">$350.00</div>
      </div>
    </div>
  </div>

  <div class="glass-card">
    <div class="label" style="margin-bottom:15px">New Expense</div>
    <div class="input-group">
      <input type="number" id="mvr-input" placeholder="Amount in MVR">
    </div>
    <button class="add-btn" onclick="addExpense()">Confirm Expense</button>
    <button class="reset-btn" onclick="resetData()">Reset Monthly Tracker</button>
  </div>

  <div class="glass-card">
    <canvas id="myChart" height="200"></canvas>
  </div>
</div>

<!-- Firebase SDKs (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  // 1. Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDQ8iPyHCMzK3zyrYEBzDvidRJxpQ4EZaY",
    authDomain: "mybudget-d79e6.firebaseapp.com",
    databaseURL: "https://mybudget-d79e6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mybudget-d79e6",
    storageBucket: "mybudget-d79e6.firebasestorage.app",
    messagingSenderId: "258880197131",
    appId: "1:258880197131:web:f228ad55f3f7c0c9972d0e",
    measurementId: "G-ZC4RYVQ175"
  };

  // 2. Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const spentRef = db.ref('spentMvr');

  // 3. App Logic Constants
  const RATE = 15.45;
  const LIMIT_USD = 150;
  const BASE_SAVINGS = 400;
  const COUNTRY_SEND = 350;

  let spentMvr = 0;
  let chart;

  // 4. Listen for Cloud Data Updates
  spentRef.on('value', (snapshot) => {
    const data = snapshot.val();
    spentMvr = data || 0; 
    updateUI();
  });

  function updateUI() {
    let spentUsd = spentMvr / RATE;
    let remainingPocket = Math.max(0, LIMIT_USD - spentUsd);
    let overspend = Math.max(0, spentUsd - LIMIT_USD);
    let finalSavings = BASE_SAVINGS - overspend;

    document.getElementById('pocket-usd').innerText = `$${remainingPocket.toFixed(2)}`;
    document.getElementById('pocket-mvr').innerText = `${(remainingPocket * RATE).toFixed(2)} MVR`;
    document.getElementById('savings-usd').innerText = `$${finalSavings.toFixed(2)}`;

    let percent = (remainingPocket / LIMIT_USD) * 100;
    let bar = document.getElementById('pocket-bar');
    bar.style.width = percent + '%';
    
    let badge = document.getElementById('status-badge');
    if (overspend > 0) {
      badge.innerText = "OVERSPENT";
      badge.className = "status-badge badge-over";
      document.getElementById('savings-usd').style.color = "var(--danger)";
      bar.style.background = "var(--danger)";
    } else {
      badge.innerText = "ON TRACK";
      badge.className = "status-badge badge-safe";
      document.getElementById('savings-usd').style.color = "var(--success)";
      bar.style.background = "linear-gradient(90deg, var(--primary), var(--success))";
    }

    updateChart(spentUsd, remainingPocket, finalSavings);
  }

  function addExpense() {
    let val = parseFloat(document.getElementById('mvr-input').value);
    if (val > 0) {
      spentRef.set(spentMvr + val);
      document.getElementById('mvr-input').value = '';
    }
  }

  function resetData() {
    if(confirm("Reset everything for a new month?")) {
      spentRef.set(0);
    }
  }

  function updateChart(spent, left, savings) {
    const ctx = document.getElementById('myChart').getContext('2d');
    if (chart) chart.destroy();
    
    chart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Country Send', 'Savings', 'Spent'],
        datasets: [{
          data: [COUNTRY_SEND, Math.max(0, savings), spent],
          backgroundColor: ['#3b82f6', '#22c55e', '#ef4444'],
          borderWidth: 0,
          hoverOffset: 4
        }]
      },
      options: {
        plugins: {
          legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Inter' } } }
        },
        cutout: '70%'
      }
    });
  }
</script>

</body>
</html>
